site_name: Pras' Workspace
nav:
  - Home: README.md
  - Blog: blog
  - Code: '!include ./code/mkdocs.yml'
  - Infrastructure: '!include ./infrastructure/mkdocs.yml'
  - Tools: tools
copyright: Copyright &copy; <a href="https://github.com/prasetiyohadi">Prasetiyo Hadi Purwoko</a>
remote_branch: main
remote_name: origin
repo_name: GitHub
repo_url: https://github.com/prasetiyohadi/workspace
# site_url: https://scripts-6si.pages.dev/
site_author: me@pras.my.id (Prasetiyo Hadi Purwoko)
site_description: >-
  System administrator and Linux enthusiast, with topics from ongoing twelve years of experience in the IT industry.
strict: false
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/prasetiyohadi
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/prasetiyohadi
    - icon: material/email
      link: mailto:me@pras.my.id
      name: Email
plugins:
  - search
  - include_dir_to_nav
  - blog
  - privacy
  - tags
  - monorepo
markdown_extensions:
  # Python Markdown
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  # Python Markdown Extensions
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.snippets:
      base_path:
        - !relative $config_dir
        - !relative $config_dir/code
        - !relative $config_dir/infrastructure
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
theme:
  language: en
  name: material
  custom_dir: overrides
  # logo: assets/logo.webp
  # favicon: assets/favicon.ico
  features:
    - announce.dismiss
    # - content.action.edit
    # - content.action.view
    # - content.code.annotate
    - content.code.copy
    # - content.code.select
    # - content.tabs.link
    # - content.tooltips
    # - content.footnote.tooltips
    - header.autohide
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.prune
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  font:
    code: JetBrains Mono
    text: Inter
  icon:
    next: fontawesome/solid/angle-right
    previous: fontawesome/solid/angle-left
    repo: fontawesome/brands/github
  palette:
    # Scheme 1: System Preference (Auto)
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Scheme 2: Light Mode (Cloud Dancer)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Scheme 3: Dark Mode (Mood Mode)
    # We use slate as the base for "Mood Mode"
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
extra_css:
  - stylesheets/extra.css
  - stylesheets/hero.css
exclude_docs: |
  my-code-docs/blog.md
  my-code-docs/markdown.md
  my-code-docs/web-apps.md
